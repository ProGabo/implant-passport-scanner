<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Consulta implantes - Clínica Dental</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
      body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background-color: #f5f8fc;
        color: #02234f;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 40px 20px;
      }

      .card {
        background: white;
        padding: 32px;
        border-radius: 16px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        max-width: 700px;
        width: 100%;
        text-align: center;
      }

      .logo {
        display: block;
        margin: 0 auto 20px auto;
        width: 220px;
        height: auto;
      }

      h2 { margin-top: 0; color: #02234f; font-size: 26px; }
      p { color: #333; margin-bottom: 24px; font-size: 16px; }

      input[type=text] {
        padding: 12px;
        font-size: 15px;
        width: 260px;
        border: 1px solid #d1d9e6;
        border-radius: 6px;
        outline: none;
      }
      input[type=text]:focus { border-color: #02234f; }

      button {
        padding: 12px 20px;
        font-size: 15px;
        border-radius: 6px;
        border: none;
        background: #02234f;
        color: white;
        cursor: pointer;
        transition: background 0.3s ease;
      }
      button:hover { background: #03306e; }
      button:disabled { background: #9bbddf; cursor: default; }

      .tooth-btn {
        background: white; 
        color: #02234f; 
        border: 1px solid #02234f;
        margin: 5px;
        font-weight: bold;
      }
      .tooth-btn:hover { background: #eef4fb; }
      .tooth-btn.active { background: #02234f; color: white; }

      .ok { color: #0a7a0a; margin-top: 15px; font-weight: 500; display:block; }
      .error { color: #b00020; margin-top: 15px; font-weight: 500; display:block; }

      /* Tabla de detalles */
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        text-align: left;
      }
      td {
        padding: 10px;
        border-bottom: 1px solid #eef2f7;
        vertical-align: top;
      }
      td.label {
        width: 40%;
        font-weight: 600;
        color: #02234f;
        background-color: #fcfcfc;
      }

      footer { margin-top: 25px; font-size: 13px; color: #777; }
    </style>
  </head>

  <body>
    <div class="card">
      <img class="logo" src="https://i.postimg.cc/tTX6JQ42/DR-PI-ESTELLER.png" alt="Clínica Dental Logo">

      <h2>Consulta tus implantes</h2>
      <p>Introduce tu código para ver tu pasaporte implantológico.</p>

      <form id="form">
        <input id="codigo" type="text" placeholder="Ej: ABC1234" autocomplete="off" />
        <button id="btn" type="submit">Buscar</button>
      </form>

      <div id="status"></div>
      <div id="resultArea"></div>

      <footer>© Clínica Dental Dr. Pi Esteller — Todos los derechos reservados</footer>
    </div>

    <script>
      const form = document.getElementById('form');
      const input = document.getElementById('codigo');
      const btn = document.getElementById('btn');
      const status = document.getElementById('status');
      const resultArea = document.getElementById('resultArea');

      // Escapar HTML por seguridad
      function escapeHtml(s) {
        return String(s || '').replace(/[&<>]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[t]));
      }

      // --- RENDERIZADO DE MÚLTIPLES IMPLANTES ---
      function renderMultiImplantView(implantes) {
        if (!implantes || implantes.length === 0) return '';

        // 1. Datos del Paciente (tomamos el primero)
        const p = implantes[0];
        
        let html = `
          <div style="background:#eef4fb; padding:15px; border-radius:8px; margin-top:20px; text-align:left;">
            <h3 style="margin:0; color:#02234f;">👤 ${escapeHtml(p.nombre)}</h3>
            <p style="margin:5px 0; font-size:14px;">
               <strong>DNI:</strong> ${escapeHtml(p.dni)} <br> 
               <strong>Email:</strong> ${escapeHtml(p.email)}
            </p>
          </div>
        `;

        // 2. Botonera de Dientes
        html += `<h4 style="color:#666; margin-top:20px;">Selecciona el diente:</h4>`;
        html += `<div style="display:flex; flex-wrap:wrap; justify-content:center; gap:5px; margin-bottom:20px;">`;
        
        implantes.forEach((imp, index) => {
          // Intentamos buscar la clave 'posicion'. Si no existe, ponemos un placeholder
          const diente = imp.posicion || imp.posiciondiente || ('#' + (index + 1)); 
          html += `<button class="tooth-btn" onclick="showImplantDetail(${index}, this)">
                    🦷 ${escapeHtml(diente)}
                   </button>`;
        });
        html += `</div>`;

        // 3. Contenedor Detalle
        html += `<div id="technicalDetail" style="text-align:left; border-top:2px solid #eee; padding-top:10px;">
                  <p style="text-align:center; color:#999; font-style:italic;">Pulsa un diente para ver los detalles técnicos.</p>
                 </div>`;

        // Guardar en memoria global
        window.currentImplants = implantes;
        return html;
      }

      // Mostrar detalle al hacer click
      window.showImplantDetail = function(index, btnElement) {
        // Gestionar estado visual de los botones
        const allBtns = document.querySelectorAll('.tooth-btn');
        allBtns.forEach(b => b.classList.remove('active'));
        if(btnElement) btnElement.classList.add('active');

        const imp = window.currentImplants[index];
        const container = document.getElementById('technicalDetail');

        // Definimos las claves que vienen de "Code.gs" -> _cleanKey
        // Ajusta las claves de la derecha según tus cabeceras reales
        const fields = [
            { label: 'Posición', key: 'posicion' },
            { label: 'Marca', key: 'marca' },
            { label: 'Modelo', key: 'modelo' },
            { label: 'Dimensiones', key: 'dimensiones' },
            { label: 'Plataforma', key: 'plataforma' },
            { label: 'Conexión', key: 'conexion' },
            { label: 'Pilar', key: 'pilar' },
            { label: 'Fecha Colocación', key: 'fecha_de_colocacion' }, 
            { label: 'Cód. Implante', key: 'cod_implante' }, // o 'codigo_implante' según header
            { label: 'Lote', key: 'lote' }
        ];

        let detailHtml = `<h4>Detalles Técnicos</h4><table>`;
        fields.forEach(f => {
            // Buscamos la clave. Si no está exacta, intentamos sin guiones bajos
            let val = imp[f.key] || imp[f.key.replace(/_/g,'')] || '';
            if(val) {
                detailHtml += `<tr><td class="label">${f.label}</td><td>${escapeHtml(val)}</td></tr>`;
            }
        });
        detailHtml += `</table>`;

        // Animación simple
        container.style.opacity = '0.5';
        container.innerHTML = detailHtml;
        setTimeout(() => container.style.opacity = '1', 100);
      };

      // --- LOGICA FORMULARIO ---
      form.addEventListener('submit', function(e){
        e.preventDefault();
        const code = input.value.trim();
        resultArea.innerHTML = '';
        status.textContent = '';
        window.currentImplants = [];

        if (!code) {
          status.innerHTML = '<span class="error">Introduce un código.</span>';
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Buscando...';

        google.script.run
          .withSuccessHandler(function(res){
            btn.disabled = false;
            btn.textContent = 'Buscar';

            if (!res || res.ok === false) {
              status.innerHTML = '<span class="error">' + (res && res.message ? escapeHtml(res.message) : 'Error desconocido.') + '</span>';
              return;
            }

            if (res.found === true && res.implantes && res.implantes.length > 0) {
              status.innerHTML = '<span class="ok">Historial encontrado ✅</span>';
              resultArea.innerHTML = renderMultiImplantView(res.implantes);
            } else {
              status.innerHTML = '<span class="error">No se encontraron datos para ese código.</span>';
            }
          })
          .withFailureHandler(function(err){
            btn.disabled = false;
            btn.textContent = 'Buscar';
            status.innerHTML = '<span class="error">Error de conexión con el servidor.</span>';
          })
          .getPatientDataVerbose(code);
      });
    </script>
  </body>
</html>
